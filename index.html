:root{
  --verde:#389B54; --verde-txt:#2B7A42; --tinta:#181423; --fondo:#F4F7F5; --tarjeta:#FFFFFF;
  --linea:#CFDCD3; --muted:#55525E; --error:#A2264B; --error-bg:#FBEAEE;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{ --verde-txt:#7FCB95; --tinta:#ECEAF1; --fondo:#121015; --tarjeta:#1C1A21;
         --linea:#3A3842; --muted:#B4B0BE; --error:#F2A5BA; --error-bg:#3A1F28; }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--fondo);color:var(--tinta);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;display:flex;flex-direction:column;min-height:100vh}
.franja{background:#389B54;height:56px;flex:none}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-top:4px solid #389B54;border-radius:12px;
  width:100%;max-width:420px;padding:32px 28px;box-shadow:0 6px 24px rgba(24,20,35,.08)}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:28px;line-height:1.2;margin:0 0 12px;color:var(--tinta)}
p.intro{margin:0 0 24px;color:var(--muted)}
label{display:block;font-weight:700;margin-bottom:6px}
.campo{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--tinta);background:var(--tarjeta);border:1px solid var(--linea);border-radius:8px;padding:10px 12px}
input:focus{outline:2px solid #389B54;outline-offset:1px;border-color:#389B54}
button{font:inherit;font-weight:700;border-radius:8px;cursor:pointer;padding:10px 14px}
.ver{background:transparent;color:var(--verde-txt);border:1px solid var(--linea);flex:none}
.ver:focus-visible,.ingresar:focus-visible{outline:2px solid #389B54;outline-offset:2px}
.ingresar{display:block;width:100%;margin-top:16px;background:#389B54;color:#fff;border:0;padding:12px 14px}
.ingresar:hover{background:#2E8A4A}
.ingresar[disabled]{opacity:.7;cursor:progress}
.error{margin:16px 0 0;padding:10px 12px;border-radius:8px;background:var(--error-bg);color:var(--error);font-weight:700}
.error[hidden]{display:none}
@media (max-width:480px){ .tarjeta{padding:24px 18px} h1{font-size:24px} }
</style>
</head>
<body>
<div class="franja" aria-hidden="true"></div>
<main>
  <form class="tarjeta" id="form" autocomplete="off">
    <h1>Tablero de gestión</h1>
    <p class="intro">Este tablero es de acceso restringido. Ingresá la clave que te compartieron para verlo.</p>
    <label for="clave">Clave de acceso</label>
    <div class="campo">
      <input id="clave" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="button" class="ver" id="ver" aria-controls="clave" aria-pressed="false">Ver</button>
    </div>
    <button type="submit" class="ingresar" id="ingresar">Ingresar</button>
    <p class="error" id="error" role="alert" hidden></p>
  </form>
</main>

  const $ = id => document.getElementById(id);
  const clave = $('clave'), ver = $('ver'), btn = $('ingresar'), err = $('error');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const mostrarError = t => { err.textContent = t; err.hidden = false; };
  ver.addEventListener('click', () => {
    const visible = clave.type === 'password';
    clave.type = visible ? 'text' : 'password';
    ver.textContent = visible ? 'Ocultar' : 'Ver';
    ver.setAttribute('aria-pressed', String(visible));
    clave.focus();
  });
  clave.addEventListener('input', () => { err.hidden = true; });
  $('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    err.hidden = true;
    if (!window.crypto || !crypto.subtle) {
      mostrarError('Este navegador no permite abrir el tablero. Probá con otro navegador actualizado.');
      return;
    }
    btn.disabled = true; btn.textContent = 'Ingresando…';
    let html;
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', hash: 'SHA-256', salt: b64(CIFRADO.salt), iterations: CIFRADO.iter },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(CIFRADO.iv) }, key, b64(CIFRADO.ct));
      html = new TextDecoder().decode(plano);
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Ingresar';
      mostrarError('Clave incorrecta. Revisala e intentá de nuevo.');
      clave.select();
      return;
    }
    document.open();
    document.write(html);
    document.close();
  });
  clave.focus();
})();
